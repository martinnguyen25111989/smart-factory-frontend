<div class="wrap">
  <div class="box">

    <div class="logo-area">
      <div class="logo-icon">🏭</div>
      <div class="logo-name">Smart Factory</div>
      <div class="logo-desc">PPE Alert & Monitoring System</div>
    </div>

    <div class="card">
      <div class="card-title">Sign in to your account</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Email</label>
          <div class="input-wrap">
            <span class="ico">✉️</span>
            <input type="email" formControlName="email"
              placeholder="admin@factory.com" autocomplete="email">
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <span class="ico">🔑</span>
            <input [type]="showPw ? 'text' : 'password'"
              formControlName="password" placeholder="••••••••"
              autocomplete="current-password" style="padding-right:42px">
            <button type="button" class="eye-btn" (click)="showPw=!showPw">
              {{showPw ? '🙈' : '👁️'}}
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <button class="btn" type="submit" [disabled]="loading || form.invalid">
          {{loading ? 'Signing in…' : 'Sign In →'}}
        </button>
      </form>

      <div class="hint">
        <span>🔐</span>
        <span><b>Demo</b> &nbsp;<code>admin&#64;factory.com</code> / <code>Admin&#64;123</code></span>
      </div>
    </div>

  </div>
</div>
